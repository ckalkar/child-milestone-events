version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: child-milestone-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_DATABASE=/app/data/milestone.db
      - UPLOAD_DIR=/app/uploads
      - ALLOWED_IMAGE_TYPES=image/jpeg,image/png,image/gif,image/webp
      - ALLOWED_VIDEO_TYPES=video/mp4,video/webm,video/quicktime
      - MAX_FILE_SIZE_MB=200
    volumes:
      - backend_uploads:/app/uploads
      - backend_data:/app/data
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: child-milestone-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  backend_uploads:
    driver: local
  backend_data:
    driver: local

networks:
  app_network:
    driver: bridge
